name: Pact Access facilitator Worker build

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/facilitator-worker/**'
      - '.github/workflows/access-facilitator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pact-access-facilitator-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/facilitator-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npm run typecheck
      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir .out --config wrangler.jsonc
      - name: Verify bundle output
        run: |
          test -f .out/index.js || { echo "Worker bundle not found"; exit 1; }
          echo "Worker bundle size:"
          wc -c .out/index.js
          echo "Uncompressed bundle bytes:"
          size=$(wc -c < .out/index.js)
          echo "$size"
          echo "Worker bundle imports:"
          grep -nE 'node:|from "fs"|from "path"|from "crypto"' .out/index.js | head -30 || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pact-access-facilitator-worker
          path: |
            cloudflare/facilitator-worker/.out/
            cloudflare/facilitator-worker/package-lock.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
      - name: Check Cloudflare deployment credentials
        id: cloudflare-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured. Build artifact only, no deployment."
          fi
      - name: Apply protected-resource D1 migration
        if: ${{ steps.cloudflare-credentials.outputs.available == 'true' }}
        run: npx wrangler d1 migrations apply pact-access --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy payment-disabled facilitator Worker
        if: ${{ steps.cloudflare-credentials.outputs.available == 'true' }}
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployed Worker reports payments disabled
        if: ${{ steps.cloudflare-credentials.outputs.available == 'true' }}
        run: |
          response=$(curl --fail --silent --show-error https://pact-access-facilitator.tajudeenisah02.workers.dev/api/access/payment-health)
          echo "$response"
          echo "$response" | grep -q '"facilitatorConfigured":false'
